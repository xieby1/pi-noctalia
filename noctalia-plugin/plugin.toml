id = "local/pi-noctalia"
name = "Pi Sessions"
version = "0.1.0"
plugin_api = 34
author = "local"
description = "Live Pi session status pushed by pi-noctalia."
icon = "terminal"

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"
hover_highlight = false

[[widget.setting]]
key = "max_visible"
type = "int"
label_key = "settings.max_visible"
default = 3
min = 1
max = 10

[[panel]]
id = "sessions"
entry = "panel.luau"
width = 520
height = 420
placement = "attached"
open_near_click = true
